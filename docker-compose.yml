services:
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"                # Prometheus web page on laptop :9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml   # your config inside the container

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"                # Grafana web page on laptop :3000