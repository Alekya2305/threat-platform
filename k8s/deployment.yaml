apiVersion: apps/v1
kind: Deployment
metadata:
  name: lookup-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lookup-api
  template:
    metadata:
      labels:
        app: lookup-api
    spec:
      containers:
        - name: api
          image: threat-api:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10